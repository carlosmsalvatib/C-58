    <meta charset="UTF-8" />
    <script>
      (function() {
        try {
          var origFetch = window.fetch;
          var fetchHolder = origFetch ? origFetch.bind(window) : undefined;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return fetchHolder || origFetch;
            },
            set: function(fn) {
              fetchHolder = fn;
            }
          });
        } catch (err) {
          try {
            var protoFetch = Window.prototype.fetch;
            var protoFetchHolder = protoFetch ? protoFetch.bind(window) : undefined;
            Object.defineProperty(Window.prototype, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function() {
                return protoFetchHolder || protoFetch;
              },
              set: function(fn) {
                protoFetchHolder = fn;
              }
            });
          } catch (err2) {}
        }
      })();
    </script>
